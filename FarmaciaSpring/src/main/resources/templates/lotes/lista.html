<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lotes · Farmacia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- PWA: permite "instalar" la app en el celular y en el PC -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav('lotes')}"></th:block>

<main>
    <div class="encabezado"><div><h1>Lotes</h1><p class="subtitulo">Stock por lote y fecha de vencimiento.</p></div></div>

    <div th:if="${ok}" class="alerta ok" th:text="${ok}"></div>
    <div th:if="${error}" class="alerta error" th:text="${error}"></div>

    <div class="herramientas">
        <span></span>
        <a class="btn principal" sec:authorize="hasAnyRole('ADMIN','ADMIN_SUCURSAL','REGENTE')" th:href="@{/lotes/nuevo}">+ Nuevo lote</a>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
            <tr>
                <th>Lote</th><th>Medicamento</th><th>Sucursal</th><th>Proveedor</th>
                <th class="num">Actual</th><th class="num">Inicial</th>
                <th>Fabricación</th><th>Vencimiento</th><th>Estado</th><th sec:authorize="hasAnyRole('ADMIN','ADMIN_SUCURSAL','REGENTE')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${lotes}">
                <td th:text="${l.idLote()}">1</td>
                <td th:text="${l.medicamento()}">Med</td>
                <td th:text="${l.sucursal()}">Suc</td>
                <td th:text="${l.proveedor()}">Prov</td>
                <td class="num" th:text="${l.cantidadActual()}">0</td>
                <td class="num" th:text="${l.cantidadInicial()}">0</td>
                <td th:text="${l.fabricacion()}">01/01/2026</td>
                <td th:text="${l.vencimiento()}">01/01/2027</td>
                <td><span th:class="'etiqueta ' + ${l.clase()}" th:text="${l.etiqueta()}">Vigente</span></td>
                <td class="acciones" sec:authorize="hasAnyRole('ADMIN','ADMIN_SUCURSAL','REGENTE')">
                    <a class="btn pequeno" th:href="@{/lotes/{id}/editar(id=${l.idLote()})}">Editar</a>
                    <a class="btn pequeno" th:if="${l.cantidadActual() > 0 and l.clase() != 'vencido'}"
                       th:href="@{/lotes/{id}/trasladar(id=${l.idLote()})}">Trasladar</a>
                    <form sec:authorize="hasRole('ADMIN')" th:action="@{/lotes/{id}/eliminar(id=${l.idLote()})}" method="post"
                          data-confirmar="¿Eliminar este lote?">
                        <button type="submit" class="btn pequeno peligro">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lotes)}">
                <td colspan="10" class="vacio">No hay lotes registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
