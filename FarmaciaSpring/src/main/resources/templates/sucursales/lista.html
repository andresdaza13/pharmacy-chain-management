<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sucursales · Farmacia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- PWA: permite "instalar" la app en el celular y en el PC -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav('sucursales')}"></th:block>

<main>
    <div class="encabezado">
        <div>
            <h1>Sucursales</h1>
            <p class="subtitulo">Cada sucursal controla su propio inventario. Se gestionan con <code>pkg_sucursales</code>.</p>
        </div>
        <a class="btn principal" sec:authorize="hasRole('ADMIN')" th:href="@{/sucursales/nuevo}">+ Nueva sucursal</a>
    </div>

    <div th:if="${ok}" class="alerta ok" role="status" th:text="${ok}"></div>
    <div th:if="${error}" class="alerta error" role="alert" th:text="${error}"></div>

    <section class="rejilla-tarjetas">
        <article class="tarjeta-sucursal" th:each="s : ${sucursales}">
            <header>
                <span class="icono-sucursal" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>
                </span>
                <div>
                    <h2 th:text="${s.nombre()}">Sucursal</h2>
                    <p th:text="${s.ciudad()} + (${s.direccion()} != null ? ' · ' + ${s.direccion()} : '')">Ciudad</p>
                </div>
            </header>
            <dl class="cifras">
                <div><dt>Empleados</dt><dd th:text="${s.empleados()}">0</dd></div>
                <div><dt>Lotes</dt><dd th:text="${s.lotes()}">0</dd></div>
                <div><dt>Ventas</dt><dd th:text="${s.ventas()}">0</dd></div>
            </dl>
            <footer class="acciones" sec:authorize="hasRole('ADMIN')">
                <a class="btn pequeno" th:href="@{/sucursales/{id}/editar(id=${s.id()})}">Editar</a>
                <form th:if="${s.eliminable()}" th:action="@{/sucursales/{id}/eliminar(id=${s.id()})}" method="post"
                      data-confirmar="¿Eliminar esta sucursal?">
                    <button type="submit" class="btn pequeno peligro">Eliminar</button>
                </form>
                <span class="ayuda" th:unless="${s.eliminable()}">Tiene datos asociados: no se puede eliminar</span>
            </footer>
        </article>
        <p class="vacio-tarjeta" th:if="${#lists.isEmpty(sucursales)}">Aún no hay sucursales.</p>
    </section>
</main>
</body>
</html>
