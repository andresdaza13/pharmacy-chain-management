<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Medicamentos · Farmacia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- PWA: permite "instalar" la app en el celular y en el PC -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav('medicamentos')}"></th:block>

<main>
    <div class="encabezado"><div><h1>Medicamentos</h1><p class="subtitulo">Catálogo con su precio y si requiere receta.</p></div></div>

    <div th:if="${ok}" class="alerta ok" th:text="${ok}"></div>
    <div th:if="${error}" class="alerta error" th:text="${error}"></div>

    <div class="herramientas">
        <form th:action="@{/medicamentos}" method="get" class="buscador">
            <input type="text" name="q" th:value="${q}" placeholder="Buscar por nombre comercial o genérico">
            <button type="submit" class="btn">Buscar</button>
            <a class="btn secundario" th:href="@{/medicamentos}">Ver todos</a>
        </form>
        <a class="btn principal" sec:authorize="hasRole('ADMIN')" th:href="@{/medicamentos/nuevo}">+ Nuevo medicamento</a>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
            <tr>
                <th>ID</th><th>Nombre comercial</th><th>Genérico</th><th>Presentación</th><th>Categoría</th>
                <th class="num">Precio</th><th>Receta</th><th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${medicamentos}">
                <td th:text="${m.id()}">1</td>
                <td th:text="${m.nombre()}">Nombre</td>
                <td th:text="${m.nombreGenerico()}">Genérico</td>
                <td th:text="${m.presentacion()}">Presentación</td>
                <td th:text="${m.categoria()}">Categoría</td>
                <td class="num" th:text="'$ ' + ${#numbers.formatDecimal(m.precio(), 1, 'POINT', 0, 'COMMA')}">$ 0</td>
                <td th:text="${m.requiereReceta()} ? 'Sí' : 'No'">No</td>
                <td class="acciones" sec:authorize="hasRole('ADMIN')">
                    <a class="btn pequeno" th:href="@{/medicamentos/{id}/editar(id=${m.id()})}">Editar</a>
                    <form sec:authorize="hasRole('ADMIN')" th:action="@{/medicamentos/{id}/eliminar(id=${m.id()})}" method="post"
                          data-confirmar="¿Eliminar este medicamento?">
                        <button type="submit" class="btn pequeno peligro">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(medicamentos)}">
                <td colspan="8" class="vacio">No se encontraron medicamentos.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
