<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Empleado · Farmacia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- PWA: permite "instalar" la app en el celular y en el PC -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav('empleados')}"></th:block>

<main class="estrecho">
    <h1 th:text="${form.id == null} ? 'Nuevo empleado' : 'Editar empleado'">Formulario</h1>

    <div th:if="${error}" class="alerta error" th:text="${error}"></div>

    <form th:action="@{/empleados/guardar}" th:object="${form}" method="post" class="formulario">
        <input type="hidden" th:field="*{id}">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" >
        <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" th:field="*{apellido}" >
        <span class="campo-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>

        <label for="documento">Documento</label>
        <input type="text" id="documento" th:field="*{documento}" >
        <span class="campo-error" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></span>

        <label for="email">Correo</label>
        <input type="email" id="email" th:field="*{email}" >
        <span class="campo-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="cargo">Cargo</label>
        <!-- Opciones leídas del CHECK de la tabla Empleado (ver CatalogoRepository.cargos) -->
        <select id="cargo" th:field="*{cargo}">
            <option value="">-- Selecciona --</option>
            <option th:each="c : ${cargos}" th:value="${c}" th:text="${#strings.capitalize(#strings.toLowerCase(c))}">Cargo</option>
        </select>
        <span class="campo-error" th:if="${#fields.hasErrors('cargo')}" th:errors="*{cargo}"></span>

        <label for="salario">Salario</label>
        <input type="number" id="salario" th:field="*{salario}" step="0.01" min="0">
        <span class="campo-error" th:if="${#fields.hasErrors('salario')}" th:errors="*{salario}"></span>

        <label for="idSucursal">Sucursal</label>
        <select id="idSucursal" th:field="*{idSucursal}">
            <option value="">-- Selecciona --</option>
            <option th:each="o : ${sucursales}" th:value="${o.id()}" th:text="${o.texto()}">Opción</option>
        </select>
        <span class="campo-error" th:if="${#fields.hasErrors('idSucursal')}" th:errors="*{idSucursal}"></span>

        <div class="botones">
            <button type="submit" class="btn principal">Guardar</button>
            <a class="btn secundario" th:href="@{/empleados}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
