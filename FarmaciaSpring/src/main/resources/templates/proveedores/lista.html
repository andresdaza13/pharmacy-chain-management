<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Proveedores · Farmacia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- PWA: permite "instalar" la app en el celular y en el PC -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav('proveedores')}"></th:block>

<main>
    <div class="encabezado"><div><h1>Proveedores</h1><p class="subtitulo">Quién abastece los lotes.</p></div></div>

    <div th:if="${ok}" class="alerta ok" th:text="${ok}"></div>
    <div th:if="${error}" class="alerta error" th:text="${error}"></div>

    <div class="herramientas">
        <form th:action="@{/proveedores}" method="get" class="buscador">
            <input type="text" name="q" th:value="${q}" placeholder="Buscar">
            <button type="submit" class="btn">Buscar</button>
            <a class="btn secundario" th:href="@{/proveedores}">Ver todos</a>
        </form>
        <a class="btn principal" sec:authorize="hasAnyRole('ADMIN','ADMIN_SUCURSAL')" th:href="@{/proveedores/nuevo}">+ Nuevo proveedor</a>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
            <tr><th>ID</th><th>NIT</th><th>Nombre</th><th>Dirección</th><th sec:authorize="hasAnyRole('ADMIN','ADMIN_SUCURSAL')">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${proveedores}">
                <td th:text="${p.id()}">1</td>
                <td th:text="${p.nit()}">NIT</td>
                <td th:text="${p.nombre()}">Nombre</td>
                <td th:text="${p.direccion()}">Dirección</td>
                <td class="acciones" sec:authorize="hasAnyRole('ADMIN','ADMIN_SUCURSAL')">
                    <a class="btn pequeno" th:href="@{/proveedores/{id}/editar(id=${p.id()})}">Editar</a>
                    <form sec:authorize="hasRole('ADMIN')" th:action="@{/proveedores/{id}/eliminar(id=${p.id()})}" method="post"
                          data-confirmar="¿Eliminar este proveedor?">
                        <button type="submit" class="btn pequeno peligro">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(proveedores)}">
                <td colspan="5" class="vacio">No se encontraron proveedores.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
