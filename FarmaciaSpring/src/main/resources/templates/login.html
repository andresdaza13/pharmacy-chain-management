<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ingresar · Farmacia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- PWA: permite "instalar" la app en el celular y en el PC -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}">
    <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="pagina-login">
<section class="login-portada" aria-hidden="true">
    <div class="login-logo"><span class="capsula grande"></span> Farmacia</div>
    <p class="login-lema">Registra cada venta y mantén el stock de cada lote al día.</p>
</section>

<main class="login-contenido">
    <form th:action="@{/login}" method="post" class="login-tarjeta">
        <h1>Iniciar sesión</h1>
        <p class="login-ayuda">Usa tu usuario de Oracle.</p>

        <div th:if="${param.error}" class="alerta error" role="alert"
             th:text="${session.SPRING_SECURITY_LAST_EXCEPTION != null} ? ${session.SPRING_SECURITY_LAST_EXCEPTION.message} : 'Usuario o contraseña incorrectos.'">Error</div>
        <div th:if="${param.salio}" class="alerta ok" role="status">Cerraste sesión.</div>

        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">Contraseña</label>
        <div class="campo-clave">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" id="ver" class="ver-clave" aria-label="Mostrar contraseña">Ver</button>
        </div>

        <button type="submit" class="btn principal grande">Ingresar</button>
    </form>
</main>

<script>
    document.getElementById('ver').addEventListener('click', function () {
        var campo = document.getElementById('password');
        var oculto = campo.type === 'password';
        campo.type = oculto ? 'text' : 'password';
        this.textContent = oculto ? 'Ocultar' : 'Ver';
        this.setAttribute('aria-label', oculto ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
</script>
</body>
</html>
