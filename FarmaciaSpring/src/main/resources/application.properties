spring.application.name=farmacia
server.port=8080

# ---- CONEXIÓN A ORACLE (cambia usuario/clave si usaste otros) ----
# Oracle XE 21c: servicio XEPDB1 | Oracle XE 11g: jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:farmacia_app}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.hikari.maximum-pool-size=5

spring.thymeleaf.cache=false

# ---- Detrás de Caddy (HTTPS): respeta las cabeceras X-Forwarded-* para generar URLs https ----
server.forward-headers-strategy=framework
# Sesión: 8 horas (una jornada de trabajo en la farmacia)
server.servlet.session.timeout=8h
# Sirve sw.js y el manifest con el tipo correcto
spring.mvc.contentnegotiation.media-types.webmanifest=application/manifest+json
spring.config.import=optional:classpath:application-local.properties